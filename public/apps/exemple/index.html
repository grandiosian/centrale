<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de bord · Exemple</title>
<style>
  :root {
    --fond: #f6f5f2; --surface: #fff; --texte: #1d1f24; --doux: #62666f; --bord: #dedbd3;
    --accent: #1f5f8b; --accent-texte: #fff; --code-fond: #efece6; --ok: #1f6b3a; --alerte: #9a5b00; --danger: #a8321f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #16181c; --surface: #1f2228; --texte: #e8e6e1; --doux: #a2a5ad; --bord: #343841;
      --accent: #6aa9d6; --accent-texte: #0d1520; --code-fond: #2a2e35; --ok: #8fd3a5; --alerte: #f0b35a; --danger: #f08a77;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--bord); }
  header strong { font-size: 1.05rem; }
  #qui { display: flex; align-items: center; gap: 10px; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { margin: 0 0 6px; font-size: 1.7rem; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .sous { color: var(--doux); margin: 0 0 24px; }
  .carte { background: var(--surface); border: 1px solid var(--bord); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  input[type=text], select, textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--texte);
             background: var(--fond); border: 1px solid var(--bord); border-radius: 8px; }
  textarea { min-height: 180px; resize: vertical; }
  .champ { margin-bottom: 14px; }
  .etat { font-size: .9rem; color: var(--doux); min-height: 1.4em; }
  .etat[data-etat=enregistre] { color: var(--ok); }
  .etat[data-etat=hors-ligne], .etat[data-etat=erreur] { color: var(--alerte); }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: var(--accent-texte); }
  button.secondaire { background: transparent; color: var(--accent); }
  button.petit { padding: 4px 10px; font-size: .9rem; }
  ul.fichiers { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.fichiers li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0;
                   border-top: 1px solid var(--bord); }
  ul.fichiers li span { overflow-wrap: anywhere; }
  .vide { color: var(--doux); font-style: italic; }
  .jauge { height: 6px; background: var(--code-fond); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .jauge i { display: block; height: 100%; background: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <strong>Carnet de bord</strong>
  <div id="qui" hidden></div>
</header>

<main>
  <!-- Connexion avec le code personnel -->
  <section id="ecran-connexion">
    <h1>Bonjour !</h1>
    <p class="sous">Tape le code personnel que ton professeur t'a donné.</p>
    <div class="carte" id="connexion"></div>
  </section>

  <!-- Le travail : tout est sauvegardé automatiquement sur le serveur -->
  <section id="ecran-travail" hidden>
    <h1>Mon carnet de bord</h1>
    <p class="sous">Tout ce que tu écris est enregistré automatiquement. Tu le retrouveras sur n'importe quel ordinateur avec ton code.</p>

    <div class="carte">
      <div class="champ">
        <label for="seance">Séance</label>
        <select id="seance"></select>
      </div>
      <div class="champ">
        <label for="titre">Ce que j'ai fait</label>
        <input type="text" id="titre" placeholder="ex. Montage du capteur de distance">
      </div>
      <div class="champ">
        <label for="texte">Explications, difficultés, idées</label>
        <textarea id="texte" placeholder="Aujourd'hui, nous avons…"></textarea>
      </div>
      <div class="etat" id="etat"></div>
    </div>

    <div class="carte">
      <h2>Mes fichiers (photos, programmes…)</h2>
      <input type="file" id="choix-fichier" hidden>
      <button id="ajouter-fichier" class="secondaire">Ajouter un fichier</button>
      <ul class="fichiers" id="liste-fichiers"></ul>
      <div class="etat" id="espace"></div>
      <div class="jauge"><i id="jauge" style="width:0"></i></div>
    </div>
  </section>
</main>

<!--
  Ici l'application est hébergée sur le même serveur que la Centrale, d'où les chemins relatifs.
  Pour une application sur GitHub Pages ou la Forge, mettez les adresses complètes :
    <script src="https://VOTRE-COMPTE.alwaysdata.net/js/centrale-client.js"></script>
    api: "https://VOTRE-COMPTE.alwaysdata.net/api/"
  et ajoutez l'adresse du site dans « Sites autorisés » de l'espace enseignant.
-->
<script src="../../js/centrale-client.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const SEANCES = ['Séance 1', 'Séance 2', 'Séance 3', 'Séance 4', 'Séance 5', 'Séance 6'];

  Centrale.init({
    api: '../../api/',
    app: 'carnet-de-bord',
    surDeconnexion: () => location.reload(),   // session expirée : on revient au code
  });
  Centrale.afficherEtat($('etat'));
  Centrale.afficherConnexion($('connexion'), { onConnecte: demarrer });

  let carnet = {};   // { "Séance 1": { titre, texte }, … }

  async function demarrer(infos) {
    $('ecran-connexion').hidden = true;
    $('ecran-travail').hidden = false;
    afficherQui(infos);

    // 1. On reprend le travail là où l'élève l'avait laissé
    carnet = await Centrale.charger('carnet', {});
    SEANCES.forEach((s) => $('seance').add(new Option(s + (carnet[s] ? ' ✓' : ''), s)));
    $('seance').value = localStorage.getItem('carnet-seance') || SEANCES[0];
    afficherSeance();
    afficherFichiers();
  }

  function afficherQui(infos) {
    $('qui').hidden = false;
    $('qui').innerHTML = '';
    $('qui').append(`${infos.classe} · élève ${infos.eleve}`);
    const sortir = document.createElement('button');
    sortir.className = 'petit secondaire';
    sortir.textContent = 'Se déconnecter';
    sortir.onclick = () => {
      Centrale.deconnexion();   // envoie d'abord ce qui n'était pas encore enregistré
      location.reload();
    };
    $('qui').append(sortir);
  }

  function afficherSeance() {
    const s = carnet[$('seance').value] || {};
    $('titre').value = s.titre || '';
    $('texte').value = s.texte || '';
  }

  // 2. À chaque modification, on sauvegarde (les envois sont regroupés toutes les 3 s)
  function modifier() {
    carnet[$('seance').value] = { titre: $('titre').value, texte: $('texte').value };
    Centrale.sauver('carnet', carnet);
  }
  $('titre').addEventListener('input', modifier);
  $('texte').addEventListener('input', modifier);
  $('seance').addEventListener('change', () => {
    try { localStorage.setItem('carnet-seance', $('seance').value); } catch (e) {}
    afficherSeance();
  });

  // 3. Fichiers : envoyés sur le serveur, rechargeables partout
  $('ajouter-fichier').onclick = () => $('choix-fichier').click();
  $('choix-fichier').onchange = async () => {
    const f = $('choix-fichier').files[0];
    if (!f) return;
    $('ajouter-fichier').disabled = true;
    $('ajouter-fichier').textContent = 'Envoi…';
    try {
      await Centrale.envoyerFichier(f);
    } catch (e) {
      alert(e.message);
    }
    $('ajouter-fichier').disabled = false;
    $('ajouter-fichier').textContent = 'Ajouter un fichier';
    $('choix-fichier').value = '';
    afficherFichiers();
  };

  async function afficherFichiers() {
    const liste = $('liste-fichiers');
    let fichiers = [];
    try { fichiers = await Centrale.listeFichiers(); } catch (e) { liste.innerHTML = '<li class="vide">' + e.message + '</li>'; return; }
    liste.innerHTML = fichiers.length ? '' : '<li class="vide">Aucun fichier pour l\'instant.</li>';
    fichiers.forEach((f) => {
      const li = document.createElement('li');
      const nom = document.createElement('span');
      nom.textContent = `${f.nom} (${Math.ceil(f.taille / 1024)} Ko)`;
      const ouvrir = document.createElement('button');
      ouvrir.className = 'petit secondaire';
      ouvrir.textContent = 'Récupérer';
      ouvrir.onclick = async () => Centrale.telecharger(await Centrale.chargerFichier(f.nom), f.nom);
      const suppr = document.createElement('button');
      suppr.className = 'petit secondaire';
      suppr.textContent = 'Supprimer';
      suppr.onclick = async () => {
        if (!confirm(`Supprimer ${f.nom} ?`)) return;
        await Centrale.supprimerFichier(f.nom);
        afficherFichiers();
      };
      const boutons = document.createElement('div');
      boutons.append(ouvrir, ' ', suppr);
      li.append(nom, boutons);
      liste.append(li);
    });
    const e = Centrale.session().espace;
    if (e) {
      $('espace').textContent = `Espace utilisé : ${(e.utilise / 1048576).toFixed(1)} Mo sur ${Math.round(e.quota / 1048576)} Mo`;
      $('jauge').style.width = Math.min(100, (100 * e.utilise) / e.quota) + '%';
    }
  }
</script>
</body>
</html>
