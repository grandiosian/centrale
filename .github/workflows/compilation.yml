# Installe et met à jour la chaîne de compilation des cartes (TechnoStudio) sur alwaysdata.
#
# Utilise les mêmes secrets que le déploiement de la Centrale (ALWAYSDATA_COMPTE, ALWAYSDATA_SSH_KEY).
# - Code : dossier serveur-compilation/ du dépôt grandiosian/TechnoStudio → ~/technostudio-compilation/code/
# - Outils : arduino-cli (~/bin), cœurs Arduino AVR et ESP32 (~/.arduino15), bibliothèques (~/Arduino),
#   MicroPython micro:bit. La chaîne arduino-cli est préparée ICI, sur la machine GitHub, puis copiée :
#   sur alwaysdata, arduino-cli est tué (mémoire) pendant l'installation des cœurs.
# - Accès web : public/api/compilation.php (déployé avec la Centrale) lit ~/technostudio-compilation/config.json
# Rien n'est placé dans www/centrale : le déploiement de la Centrale (rsync --delete) n'y touche pas.
#
# Déclenchement : modification de ce fichier ou de compilation.php, à la demande (Actions → Run workflow),
# et chaque nuit (reprend les mises à jour de TechnoStudio ; ce qui est installé n'est pas refait).

name: Chaîne de compilation (TechnoStudio)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/compilation.yml', 'public/api/compilation.php']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: compilation
  cancel-in-progress: false

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Code du compilateur (dépôt TechnoStudio)
        uses: actions/checkout@v4
        with:
          repository: grandiosian/TechnoStudio
          path: ts

      - name: Préparer la chaîne de compilation (machine GitHub)
        env:
          # ESP32 en C++ : ≈ 700 Mo de plus sur le serveur (hébergement de 100 Go). Variable du dépôt COMPILATION_ESP32=non pour s'en passer.
          ESP32: ${{ vars.COMPILATION_ESP32 || 'oui' }}
        run: |
          set +e
          bash ts/serveur-compilation/preparer-chaine.sh ~/chaine > preparation.log 2>&1; r=$?
          a() { t="${3//'%'/'%25'}"; t="${t//$'\n'/'%0A'}"; echo "::$1 title=$2::${t:0:3500}"; }
          a notice préparation "$(grep -E 'Ko →|^[0-9.]+[KMG]\s|Sketch uses|Le croquis' preparation.log | tail -c 3000)"
          [ $r -eq 0 ] || { a error préparation "$(tail -c 3000 preparation.log)"; exit 1; }

      - name: Secrets configurés ?
        id: config
        env:
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
          CLE: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          if [ -n "$COMPTE" ] && [ -n "$CLE" ]; then echo "pret=true" >> "$GITHUB_OUTPUT"
          else echo "pret=false" >> "$GITHUB_OUTPUT"; echo "::notice::Ajoutez les secrets ALWAYSDATA_COMPTE et ALWAYSDATA_SSH_KEY."; fi

      - name: Connexion SSH
        if: steps.config.outputs.pret == 'true'
        env:
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
          CLE: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement && chmod 600 ~/.ssh/id_deploiement
          ssh-keyscan -H "ssh-$COMPTE.alwaysdata.net" >> ~/.ssh/known_hosts
          printf 'Host ad\n  HostName ssh-%s.alwaysdata.net\n  User %s\n  IdentityFile ~/.ssh/id_deploiement\n  ServerAliveInterval 30\n' "$COMPTE" "$COMPTE" > ~/.ssh/config

      - name: Envoyer le code du compilateur
        if: steps.config.outputs.pret == 'true'
        run: |
          ssh ad 'mkdir -p technostudio-compilation/code'
          rsync -az --delete --exclude node_modules --exclude 'microbit/*.hex' ts/serveur-compilation/ ad:technostudio-compilation/code/

      - name: Copier la chaîne sur le serveur
        if: steps.config.outputs.pret == 'true'
        run: |
          set +e
          a() { t="${3//'%'/'%25'}"; t="${t//$'\n'/'%0A'}"; echo "::$1 title=$2::${t:0:3500}"; }
          a notice "serveur avant copie" "$(ssh ad 'rm -rf ~/.arduino15/library_index.json* ~/.arduino15/staging ~/.cache/arduino; du -sh ~ ; du -sh ~/* ~/.[!.]* 2>/dev/null | sort -h | tail -12' 2>&1)"
          ko=0
          out=$( { ssh ad 'mkdir -p bin .arduino15 Arduino/libraries' &&
            rsync -az ~/chaine/bin/arduino-cli ad:bin/arduino-cli &&
            rsync -az --delete --exclude arduino-cli.yaml ~/chaine/arduino15/ ad:.arduino15/ &&
            rsync -az --delete ~/chaine/Arduino/libraries/ ad:Arduino/libraries/; } 2>&1 ) || ko=1
          [ $ko = 0 ] && a notice copie "chaîne copiée $(du -sh ~/chaine | cut -f1)" || { a error copie "$(echo "$out" | tail -c 3000)"; exit 1; }

      - name: Installer ou mettre à jour (arduino-cli, cœurs, MicroPython)
        if: steps.config.outputs.pret == 'true'
        run: |
          set +e
          # Résultats en annotations : lisibles dans l'onglet Actions et par l'API
          a() { t="${3//'%'/'%25'}"; t="${t//$'\n'/'%0A'}"; echo "::$1 title=$2::${t:0:3500}"; }
          ssh ad 'bash technostudio-compilation/code/installer-centrale.sh --chaine-copiee' > installation.log 2>&1; r=$?
          # journal complet, en morceaux (une annotation fait 3500 caractères au plus)
          sed -e 's/\x1b\[[0-9;]*m//g' installation.log | grep -v '^\s*$' | grep -vE 'Downloading|\[=+' > journal.txt || true
          n=0; while [ $n -lt 8 ]; do part=$(tail -c +$((n * 3400 + 1)) journal.txt | head -c 3400); [ -z "$part" ] && break; a notice "installation $((n + 1))" "$part"; n=$((n + 1)); done
          [ $r -eq 0 ] || { a error installation "code $r"; exit 1; }

      - name: Essais de compilation sur le serveur
        if: steps.config.outputs.pret == 'true'
        run: |
          set +e
          a() { t="${3//'%'/'%25'}"; t="${t//$'\n'/'%0A'}"; echo "::$1 title=$2::${t:0:3500}"; }
          a notice diagnostic "$(ssh ad 'ulimit -a | grep -iE "memory|virtual|cpu"; cat /sys/fs/cgroup/memory.max 2>/dev/null; grep -E "\"(node|cli|dossier)\"" ~/technostudio-compilation/config.json; ~/bin/arduino-cli core list; du -sh ~/.arduino15 ~/Arduino' 2>&1)"
          ko=0
          for c in uno nano microbit $( [ "${{ vars.COMPILATION_ESP32 || 'oui' }}" = oui ] && echo esp32 ); do
            out=$(ssh ad "C=~/technostudio-compilation; N=\$(sed -n 's/.*\"node\": *\"\\([^\"]*\\)\".*/\\1/p' \$C/config.json); \$N \$C/code/compiler-cli.js essai $c --dossier \$C/travail" 2>&1); r=$?
            if [ $r -eq 0 ]; then a notice "serveur $c" "$out"; else a error "serveur $c" "$out"; ko=1; fi
          done
          exit $ko

      - name: API en ligne (api/compilation.php)
        if: steps.config.outputs.pret == 'true'
        env:
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
          URL: ${{ vars.URL_CENTRALE }}
        run: |
          BASE="${URL:-https://$COMPTE.alwaysdata.net/}"
          API="${BASE%/}/api/compilation.php"
          CLE=$(ssh ad 'sed -n "/\"cles\"/,/\]/p" ~/technostudio-compilation/config.json | grep -o "[a-f0-9]\{32\}" | head -1')
          echo "::add-mask::$CLE"
          # La page arrive avec le déploiement de la Centrale (workflow voisin) : on l'attend un peu
          for i in $(seq 1 30); do
            code=$(curl -s -o etat.json -w '%{http_code}' "$API"); [ "$code" = 200 ] && break; sleep 10
          done
          echo "::notice title=API état ($code)::$(head -c 1500 etat.json)"
          [ "$code" = 200 ] || { echo "::error title=API::$API ne répond pas ($code)"; exit 1; }
          echo "::notice title=API depuis GitHub Pages::$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://grandiosian.github.io' "$API") (200 : site autorisé ; 403 : ajouter https://grandiosian.github.io dans Réglages → Sites autorisés)"
          echo "::notice title=API sans connexion::$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"carte":"uno","code":"void setup(){}"}' "$API") (attendu : 401)"
          ko=0
          for c in uno nano microbit $( [ "${{ vars.COMPILATION_ESP32 || 'oui' }}" = oui ] && echo esp32 ); do
            case $c in uno|nano) prog='void setup(){pinMode(13,OUTPUT);}\nvoid loop(){digitalWrite(13,!digitalRead(13));delay(300);}';;
              esp32) prog='void setup(){pinMode(2,OUTPUT);}\nvoid loop(){digitalWrite(2,!digitalRead(2));delay(300);}';;
              *) prog='from microbit import *\ndisplay.scroll(\"Centrale\")';; esac
            r=$(curl -s -m 60 -X POST -H 'Content-Type: application/json' -H "X-Cle: $CLE" -d "{\"carte\":\"$c\",\"code\":\"$prog\"}" "$API")
            id=$(echo "$r" | sed -n 's/.*"travail":"\([a-f0-9]*\)".*/\1/p')
            for i in $(seq 1 90); do [ -z "$id" ] && break; sleep 4; r=$(curl -s -H "X-Cle: $CLE" "$API?travail=$id"); echo "$r" | grep -q '"enCours":true' || break; done
            res=$(echo "$r" | sed 's/"hex":"[^"]*"/"hex":"…"/; s/"donnees":"[^"]*"/"donnees":"…"/g' | head -c 2500)
            if echo "$r" | grep -q '"format"'; then echo "::notice title=API $c::$res"; else echo "::error title=API $c::$res"; ko=1; fi
          done
          exit $ko
