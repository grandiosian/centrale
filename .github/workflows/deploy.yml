# Envoie automatiquement le code sur alwaysdata à chaque modification de la branche main.
#
# À configurer une seule fois dans GitHub : Settings → Secrets and variables → Actions
#   Secrets :
#     ALWAYSDATA_COMPTE   nom du compte alwaysdata (ex. lionelc)
#     ALWAYSDATA_SSH_KEY  clé SSH PRIVÉE dont la clé publique est dans ~/.ssh/authorized_keys sur alwaysdata
#   Variable (facultative) :
#     DOSSIER_DISTANT     dossier sur alwaysdata (par défaut : www/centrale)
#
# Le dossier data/ (base des codes élèves) n'est jamais touché par le déploiement.
#
# Copies de secours : les applications listées dans miroirs.txt sont copiées dans
# public/miroir/<nom>/ (servies à /miroir/<nom>/), après construction si la ligne le demande. Mise à jour à chaque déploiement
# et toutes les heures. Si une copie échoue, rien n'est envoyé : le serveur garde la version précédente.

name: Déployer sur alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'   # toutes les heures : met à jour les copies de secours

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Copier les applications de secours (miroirs.txt)
        run: |
          set -euo pipefail
          [ -f miroirs.txt ] || exit 0
          mkdir -p public/miroir
          # Pas de PHP dans les copies : ce sont des applications statiques
          printf '<FilesMatch "\\.(php|phtml|phar)$">\n  Require all denied\n</FilesMatch>\n' > public/miroir/.htaccess
          # Une ligne : <nom> <dépôt> [<dossier publié> [<commande de construction…>]]
          grep -vE '^\s*(#|$)' miroirs.txt | while read -r nom depot dossier commande; do
            case "$nom" in *[!A-Za-z0-9_-]*) echo "Nom invalide : $nom"; exit 1;; esac
            case "${dossier:-}" in /*|*..*) echo "Dossier invalide : $dossier"; exit 1;; esac
            echo "→ $nom ($depot)${dossier:+ : dossier $dossier}${commande:+, construit par « $commande »}"
            src="$RUNNER_TEMP/miroir-$nom"
            git clone --quiet --depth 1 "$depot" "$src"
            if [ -n "${commande:-}" ]; then (cd "$src" && bash -c "$commande"); fi
            if [ -n "${dossier:-}" ]; then src="$src/$dossier"; fi
            rm -rf "$src/.git" "$src/.github"
            mv "$src" "public/miroir/$nom"
            echo "$(date -u +%FT%TZ) $(git ls-remote "$depot" HEAD | cut -c1-7)" > "public/miroir/$nom/.copie"
          done
          ls public/miroir

      - name: Vérifier que les secrets sont configurés
        id: config
        env:
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
          CLE: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          if [ -n "$COMPTE" ] && [ -n "$CLE" ]; then
            echo "pret=true" >> "$GITHUB_OUTPUT"
          else
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement ignoré : ajoutez les secrets ALWAYSDATA_COMPTE et ALWAYSDATA_SSH_KEY (voir README, partie 5)."
          fi

      - name: Préparer la connexion SSH
        if: steps.config.outputs.pret == 'true'
        env:
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
          CLE: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          ssh-keyscan -H "ssh-$COMPTE.alwaysdata.net" >> ~/.ssh/known_hosts

      - name: Envoyer les fichiers
        if: steps.config.outputs.pret == 'true'
        env:
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
          DOSSIER: ${{ vars.DOSSIER_DISTANT || 'www/centrale' }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploiement" \
            --exclude '/data/' \
            --exclude '/.git/' \
            --exclude '/.github/' \
            ./ "$COMPTE@ssh-$COMPTE.alwaysdata.net:$DOSSIER/"
